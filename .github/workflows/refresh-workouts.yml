name: Refresh workouts from F3 Nation

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays ~5 AM Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/refresh_workouts.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/workouts.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workouts.json
          git commit -m "Refresh workout schedule from F3 Nation"
          git push
